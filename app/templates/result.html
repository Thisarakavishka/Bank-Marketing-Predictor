<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"> <!-- Linking the external CSS -->
</head>

<body>
    <h2>Prediction Result</h2>

    {% if result.error %}
    <p class="result failure">Error: {{ result.error }}</p>
    {% else %}
    <p class="result {% if result.prediction == 'YES' %}success{% else %}failure{% endif %}">
        Prediction: {{ result.prediction }}
    </p>
    <p>Probability: {{ result.probability }}%</p>
    {% endif %}

    <a href="/">Go back</a>
</body>

</html>
