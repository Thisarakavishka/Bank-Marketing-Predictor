name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull Docker image
        run: sudo docker pull thisarakavishka/bank-marketing-predictor:latest

      - name: Delete old Docker container
        run: |
          if [ "$(sudo docker ps -a -q -f name=bank-marketing-predictor)" ]; then
            sudo docker rm -f bank-marketing-predictor
          fi

      - name: Run Docker container
        run: sudo docker run -d -p 5000:5000 --name bank-marketing-predictor thisarakavishka/bank-marketing-predictor:latest
